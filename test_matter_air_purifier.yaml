# Xiaomi Air Purifier 3/3H (zhimi.airpurifier.mb3) with Matter support
# Adapted from: https://github.com/dhewg/esphome-miot/blob/main/config/zhimi.airpurifier.mb3.yaml
#
# This config uses Matter instead of the ESPHome native API (api:).
# The device appears as a standard Matter device to any Matter controller
# (Apple Home, Google Home, Samsung SmartThings, etc.) without needing
# Home Assistant or any specific ecosystem.
#
# Entities are automatically mapped to Matter endpoints:
#   - fan -> FanControl cluster
#   - switch -> OnOff cluster
#   - binary_sensor -> BooleanState cluster
#   - sensor (temperature) -> TemperatureMeasurement cluster
#   - sensor (humidity) -> RelativeHumidityMeasurement cluster

external_components:
  source: github://dhewg/esphome-miot@main

esphome:
  name: purifier-matter
  friendly_name: Air Purifier (Matter)
  comment: Xiaomi Air Purifier 3/3H with Matter support

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    # esp_matter v1.4.x requires ESP-IDF v5.4.1 (pioarduino 54.03.20)
    platform_version: https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
    version: 5.4.1

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: DEBUG

# Matter replaces api: entirely - the device is a standalone Matter device
matter:
  discriminator: 3841
  passcode: 20202022
  vendor_id: 0xFFF1
  product_id: 0x8001
  product_name: "Xiaomi Air Purifier 3H"

ota:
  - platform: esphome
    password: !secret ota_password

uart:
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 115200

miot:
  id: miot_main
  miot_heartbeat_siid: 13
  miot_heartbeat_piid: 9

fan:
  - platform: "miot"
    name: "Fan"
    state:
      miot_siid: 2
      miot_piid: 2
    speed:
      miot_siid: 10
      miot_piid: 7
      min_value: 300
      max_value: 2300
    preset_modes:
      miot_siid: 2
      miot_piid: 5
      options:
        0: "Auto"
        1: "Sleep"
        2: "Favorite"
        3: ""

switch:
  - platform: "miot"
    miot_siid: 5
    miot_piid: 1
    name: "Notification Sounds"
    icon: mdi:volume-high
    entity_category: config
  - platform: "miot"
    miot_siid: 7
    miot_piid: 1
    name: "Child Lock"
    icon: mdi:lock
    entity_category: config

binary_sensor:
  - platform: "miot"
    miot_siid: 15
    miot_piid: 5
    name: "Filter Door"
    device_class: opening
    entity_category: diagnostic

select:
  - platform: "miot"
    miot_siid: 2
    miot_piid: 4
    name: "Fan Level"
    icon: mdi:fan
    options:
      1: "Low"
      2: "Medium"
      3: "High"
  - platform: "miot"
    miot_siid: 6
    miot_piid: 1
    name: "Display Brightness"
    icon: mdi:brightness-6
    entity_category: config
    options:
      0: "High"
      1: "Low"
      2: "Off"

text_sensor:
  - platform: "miot"
    miot_siid: 2
    miot_piid: 1
    name: "Device Fault"
    icon: mdi:fan-alert
    entity_category: diagnostic
    filters:
      - map:
          - "0 -> No Faults"
          - "1 -> M1 Run"
          - "2 -> M1 Stuck"
          - "3 -> No Sensor"
          - "4 -> Humidity Error"
          - "5 -> Temperature Error"

number:
  - platform: "miot"
    miot_siid: 10
    miot_piid: 10
    name: "Favorite Fan Level"
    icon: mdi:speedometer
    min_value: 0
    max_value: 14
    step: 1

sensor:
  - platform: "miot"
    miot_siid: 3
    miot_piid: 7
    name: "Relative Humidity"
    unit_of_measurement: "%"
    device_class: humidity
    state_class: "measurement"
  - platform: "miot"
    miot_siid: 3
    miot_piid: 6
    name: "PM2.5 Density"
    unit_of_measurement: "ug/m3"
    device_class: pm25
    state_class: "measurement"
  - platform: "miot"
    miot_siid: 3
    miot_piid: 8
    name: "Temperature"
    unit_of_measurement: "C"
    device_class: temperature
    accuracy_decimals: 1
    state_class: "measurement"
  - platform: "miot"
    miot_siid: 4
    miot_piid: 3
    name: "Filter Life Level"
    unit_of_measurement: "%"
    icon: mdi:air-filter
  - platform: "miot"
    miot_siid: 4
    miot_piid: 5
    name: "Filter Used Time"
    entity_category: diagnostic
    unit_of_measurement: "h"
  - platform: "miot"
    miot_siid: 10
    miot_piid: 8
    name: "Motor Speed"
    unit_of_measurement: "rpm"
    icon: mdi:fan

button:
  - platform: "miot"
    miot_siid: 8
    miot_aiid: 1
    name: "Toggle Power"
    icon: mdi:power
  - platform: "miot"
    miot_siid: 4
    miot_aiid: 1
    miot_action_args: "3 0"
    name: "Reset Filter Life"
    icon: mdi:restart
    entity_category: config
