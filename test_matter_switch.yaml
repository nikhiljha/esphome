esphome:
  name: matter-test-switch
  friendly_name: "Matter Test Switch"

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    # esp_matter v1.4.x requires ESP-IDF v5.4.1 (pioarduino 54.03.20)
    platform_version: https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
    version: 5.4.1

logger:

# ESP32 (no 802.15.4 radio) requires WiFi for Matter commissioning.
# Thread mode is only available on ESP32-C5, ESP32-C6, and ESP32-H2.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

matter:
  discriminator: 3840
  passcode: 20202021
  vendor_id: 0xFFF1
  product_id: 0x8000
  product_name: "ESPHome Matter Switch"

switch:
  - platform: gpio
    name: "Test LED"
    pin: GPIO2
